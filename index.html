<div class="form-grid">
  <div class="form-group">
    <label for="teacherName">성명 (Full Name) *</label>
    <input type="text" id="teacherName" class="form-input" placeholder="예: 김주은" required>
  </div>

  <div class="form-group">
    <label for="teacherRole">사역 직분 (Role) *</label>
    <select id="teacherRole" class="form-select" required>
      <option value="">직분을 선택해주세요</option>
      <option value="정교사 (Full Teacher)">정교사 (Full Teacher)</option>
      <option value="보조교사 (Assistant Teacher)">보조교사 (Assistant Teacher)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="teacherDob">생년월일 (Date of Birth) *</label>
    <input type="text" id="teacherDob" class="form-input" placeholder="MM/DD/YYYY 또는 YYYY.MM.DD" required>
  </div>

  <div class="form-group">
    <label for="teacherPhone">연락처 (Phone Number) *</label>
    <input type="tel" id="teacherPhone" class="form-input" placeholder="512-000-0000" required>
  </div>

  <div class="form-group">
    <label for="teacherEmail">이메일 (Email Address) *</label>
    <input type="email" id="teacherEmail" class="form-input" placeholder="teacher@gmail.com" required>
  </div>

  <div class="form-group">
    <label for="teacherAddress">거주지 주소 (Home Address) *</label>
    <input type="text" id="teacherAddress" class="form-input" placeholder="Street, City, State, ZIP" required>
  </div>
</div>
